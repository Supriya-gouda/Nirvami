<!DOCTYPE html>
<html>
<head>
    <title>Quick Test - Nirvami Recommendations</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        .button { background: #007bff; color: white; border: none; padding: 10px 20px; margin: 5px; border-radius: 4px; cursor: pointer; }
        .button:hover { background: #0056b3; }
        .result { margin: 10px 0; padding: 10px; background: #f8f9fa; border-left: 4px solid #007bff; }
        .error { border-left-color: #dc3545; background: #f8d7da; }
        .success { border-left-color: #28a745; background: #d4edda; }
        pre { background: #f1f1f1; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Nirvami Recommendations Debug Tool</h1>
        <p>Use this tool to test your recommendation system authentication and API calls.</p>
        
        <h2>Step 1: Test Login</h2>
        <button class="button" onclick="testLogin()">Test Login with test.user@nirvami.com</button>
        <div id="loginResult"></div>
        
        <h2>Step 2: Test API Calls</h2>
        <button class="button" onclick="testRecommendations()">Get Yoga Recommendations</button>
        <button class="button" onclick="testAyurvedaRecommendations()">Get Ayurveda Recommendations</button>
        <div id="apiResult"></div>
        
        <h2>Step 3: Manual Token Setup (if login fails)</h2>
        <button class="button" onclick="setTestToken()">Set Test Token</button>
        <button class="button" onclick="clearToken()">Clear Token</button>
        <div id="tokenResult"></div>
        
        <h2>Debug Info</h2>
        <button class="button" onclick="showDebugInfo()">Show Current Auth State</button>
        <div id="debugInfo"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000/api/v1';
        let authToken = localStorage.getItem('token');
        
        function log(elementId, message, type = 'result') {
            const element = document.getElementById(elementId);
            element.innerHTML = `<div class="${type}">${message}</div>`;
        }
        
        async function testLogin() {
            try {
                log('loginResult', '🔄 Testing login...', 'result');
                
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: 'test.user@nirvami.com',
                        password: 'TestPassword123!'
                    })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    authToken = data.access_token;
                    localStorage.setItem('token', authToken);
                    log('loginResult', `✅ Login successful!<br>Token: ${authToken.substring(0, 30)}...`, 'success');
                } else {
                    const error = await response.text();
                    log('loginResult', `❌ Login failed: ${response.status}<br>${error}`, 'error');
                }
            } catch (error) {
                log('loginResult', `❌ Network error: ${error.message}`, 'error');
            }
        }
        
        async function testRecommendations() {
            if (!authToken) {
                log('apiResult', '❌ No auth token. Please login first or set test token.', 'error');
                return;
            }
            
            try {
                log('apiResult', '🔄 Fetching yoga recommendations...', 'result');
                
                const response = await fetch(`${API_BASE}/recommendations/yoga`, {
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    log('apiResult', `✅ Yoga recommendations: ${data.length} found<br><pre>${JSON.stringify(data.slice(0, 2), null, 2)}</pre>`, 'success');
                } else {
                    const error = await response.text();
                    log('apiResult', `❌ API error: ${response.status}<br>${error}`, 'error');
                }
            } catch (error) {
                log('apiResult', `❌ Network error: ${error.message}`, 'error');
            }
        }
        
        async function testAyurvedaRecommendations() {
            if (!authToken) {
                log('apiResult', '❌ No auth token. Please login first or set test token.', 'error');
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/recommendations/ayurveda`, {
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    log('apiResult', `✅ Ayurveda recommendations: ${data.length} found<br><pre>${JSON.stringify(data.slice(0, 2), null, 2)}</pre>`, 'success');
                } else {
                    const error = await response.text();
                    log('apiResult', `❌ API error: ${response.status}<br>${error}`, 'error');
                }
            } catch (error) {
                log('apiResult', `❌ Network error: ${error.message}`, 'error');
            }
        }
        
        function setTestToken() {
            // For testing purposes - use a known good token format
            authToken = 'test-token-for-user-6bde95c9-409c-40ae-aa40-c8894ffdf8e4';
            localStorage.setItem('token', authToken);
            log('tokenResult', '✅ Test token set. Try the API calls now.', 'success');
        }
        
        function clearToken() {
            authToken = null;
            localStorage.removeItem('token');
            log('tokenResult', '🗑️ Token cleared.', 'result');
        }
        
        function showDebugInfo() {
            const currentToken = localStorage.getItem('token');
            const info = `
                <strong>Current Auth State:</strong><br>
                Token in localStorage: ${currentToken ? currentToken.substring(0, 30) + '...' : 'None'}<br>
                Token in memory: ${authToken ? authToken.substring(0, 30) + '...' : 'None'}<br>
                API Base URL: ${API_BASE}
            `;
            log('debugInfo', info, 'result');
        }
        
        // Auto-load token on page load
        window.onload = function() {
            authToken = localStorage.getItem('token');
            if (authToken) {
                log('debugInfo', `🔄 Loaded token from localStorage: ${authToken.substring(0, 30)}...`, 'result');
            }
        }
    </script>
</body>
</html>
